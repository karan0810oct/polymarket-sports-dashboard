<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Polymarket Live Odds</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #2563eb;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --odds-blue: #1d4ed8;
      --odds-pink: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-header {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-weight: 700;
      font-size: 1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
    }
    .status-dot.online { background-color: var(--green); }
    .status-dot.offline { background-color: var(--red); }

    .sports-nav {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--card-border);
    }
    .sports-nav::-webkit-scrollbar { display: none; }

    .sport-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sport-pill.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .match-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .match-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .match-subtitle {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .odds-group {
      display: flex;
      gap: 6px;
    }

    .odds-btn {
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      border: none;
      min-width: 55px;
      text-align: center;
      min-height: 40px;
      transition: background-color 0.3s ease;
    }

    .odds-yes { background-color: var(--odds-blue); }
    .odds-no { background-color: var(--odds-pink); }

    .flash-up { animation: flashGreen 0.5s ease; }
    .flash-down { animation: flashRed 0.5s ease; }

    @keyframes flashGreen {
      0% { background-color: var(--green); transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes flashRed {
      0% { background-color: var(--red); transform: scale(1.06); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand">⚡ Polymarket Stream</div>
    <div class="status-badge">
      <div class="status-dot" id="ws-dot"></div>
      <span id="latency-val">--</span>ms
    </div>
  </header>

  <nav class="sports-nav">
    <button class="sport-pill active" onclick="filterSports('all', this)">🔥 All Live</button>
    <button class="sport-pill" onclick="filterSports('cricket', this)">🏏 Cricket</button>
    <button class="sport-pill" onclick="filterSports('football', this)">⚽ Football</button>
    <button class="sport-pill" onclick="filterSports('tennis', this)">🎾 Tennis</button>
    <button class="sport-pill" onclick="filterSports('mma', this)">🥊 MMA / Boxing</button>
  </nav>

  <main class="main-content">
    <section id="match-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 0.85rem;" id="loader">
        Connecting to Polymarket Live Markets...
      </div>
    </section>
  </main>

  <script>
    // Updated Working Direct API URL
    const GAMMA_API = "https://gamma-api.polymarket.com/events?active=true&closed=false&limit=30&order=volume_24hr&ascending=false";
    const WS_URL = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

    let socket;
    let trackedAssetIds = [];
    let allFetchedEvents = [];
    let pingStartTime = 0;

    async function fetchLiveMarkets() {
      try {
        const response = await fetch(GAMMA_API);
        allFetchedEvents = await response.json();
        
        renderMarkets('all');
        connectWebSocket();

      } catch (err) {
        console.error("API Fetch Error:", err);
        document.getElementById('loader').innerText = "Failed to load live data. Check internet connection.";
      }
    }

    function renderMarkets(filterCategory) {
      const listContainer = document.getElementById('match-list');
      listContainer.innerHTML = '';
      trackedAssetIds = [];

      let hasItems = false;

      allFetchedEvents.forEach(event => {
        if (!event.markets || event.markets.length === 0) return;

        event.markets.forEach(market => {
          let clobTokens = [];
          try {
            clobTokens = typeof market.clobTokenIds === 'string' ? JSON.parse(market.clobTokenIds) : market.clobTokenIds;
          } catch(e) { clobTokens = []; }

          let outcomePrices = ["0", "0"];
          try {
            outcomePrices = typeof market.outcomePrices === 'string' ? JSON.parse(market.outcomePrices) : market.outcomePrices;
          } catch(e) { outcomePrices = ["0", "0"]; }

          if (clobTokens && clobTokens.length >= 2) {
            const yesId = clobTokens[0];
            const noId = clobTokens[1];

            const titleText = (market.question || event.title).toLowerCase();
            const groupText = (event.title || "").toLowerCase();

            // Category Filter Logic
            if (filterCategory !== 'all') {
              const isMatch = titleText.includes(filterCategory) || groupText.includes(filterCategory);
              if (!isMatch) return;
            }

            hasItems = true;
            trackedAssetIds.push(yesId, noId);

            const card = document.createElement('div');
            card.className = 'match-card';

            const p1 = parseFloat(outcomePrices[0] || 0).toFixed(2);
            const p2 = parseFloat(outcomePrices[1] || 0).toFixed(2);

            card.innerHTML = `
              <div class="match-info">
                <div class="match-title">${market.question || event.title}</div>
                <div class="match-subtitle">${event.title}</div>
              </div>
              <div class="odds-group">
                <button class="odds-btn odds-yes" id="btn-${yesId}">${p1}</button>
                <button class="odds-btn odds-no" id="btn-${noId}">${p2}</button>
              </div>
            `;

            listContainer.appendChild(card);
          }
        });
      });

      if (!hasItems) {
        listContainer.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 40px 0;">No active events found for this filter.</div>`;
      }
    }

    function filterSports(category, btnElement) {
      document.querySelectorAll('.sport-pill').forEach(el => el.classList.remove('active'));
      btnElement.classList.add('active');
      renderMarkets(category);

      // Re-subscribe WebSocket if active
      if (socket && socket.readyState === WebSocket.OPEN && trackedAssetIds.length > 0) {
        socket.send(JSON.stringify({
          type: "market",
          assets_ids: trackedAssetIds
        }));
      }
    }

    function connectWebSocket() {
      if (socket) socket.close();
      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot online';
        if (trackedAssetIds.length > 0) {
          socket.send(JSON.stringify({
            type: "market",
            assets_ids: trackedAssetIds
          }));
        }
        measureLatency();
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (pingStartTime > 0) {
          const latency = Math.round(performance.now() - pingStartTime);
          document.getElementById('latency-val').innerText = latency;
          pingStartTime = 0;
        }

        if (data.event_type === "price_change" || data.event_type === "book") {
          updateOdds(data);
        }
      };

      socket.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot offline';
        setTimeout(connectWebSocket, 3000);
      };
    }

    function updateOdds(data) {
      if (!data.asset_id || !data.price) return;

      const btn = document.getElementById(`btn-${data.asset_id}`);
      if (btn) {
        const oldPrice = parseFloat(btn.innerText) || 0;
        const newPrice = parseFloat(data.price);

        if (newPrice !== oldPrice) {
          btn.innerText = newPrice.toFixed(2);
          const flashClass = newPrice > oldPrice ? 'flash-up' : 'flash-down';
          btn.classList.remove('flash-up', 'flash-down');
          void btn.offsetWidth;
          btn.classList.add(flashClass);
        }
      }
    }

    function measureLatency() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        pingStartTime = performance.now();
        socket.send("PING");
      }
      setTimeout(measureLatency, 3000);
    }

    fetchLiveMarkets();
  </script>
</body>
</html>
