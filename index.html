<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Polymarket Live Speed Feed</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #2563eb;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --odds-blue: #1d4ed8;
      --odds-pink: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .top-header {
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-weight: 700;
      font-size: 1rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
    }
    .status-dot.online { background-color: var(--green); }
    .status-dot.offline { background-color: var(--red); }

    .sports-nav {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--card-border);
    }
    .sports-nav::-webkit-scrollbar { display: none; }

    .sport-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sport-pill.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .match-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .match-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .match-subtitle {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .odds-group {
      display: flex;
      gap: 6px;
    }

    .odds-btn {
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      border: none;
      min-width: 55px;
      text-align: center;
      min-height: 40px;
      transition: background-color 0.3s ease, transform 0.15s ease;
    }

    .odds-yes { background-color: var(--odds-blue); }
    .odds-no { background-color: var(--odds-pink); }

    .flash-up { animation: flashGreen 0.5s ease; }
    .flash-down { animation: flashRed 0.5s ease; }

    @keyframes flashGreen {
      0% { background-color: var(--green); transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes flashRed {
      0% { background-color: var(--red); transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand">⚡ Polymarket Stream</div>
    <div class="status-badge">
      <div class="status-dot" id="ws-dot"></div>
      <span id="latency-val">--</span>ms
    </div>
  </header>

  <nav class="sports-nav">
    <button class="sport-pill active" onclick="filterSports('all', this)">🔥 All Live</button>
    <button class="sport-pill" onclick="filterSports('cricket', this)">🏏 Cricket</button>
    <button class="sport-pill" onclick="filterSports('football', this)">⚽ Football</button>
    <button class="sport-pill" onclick="filterSports('tennis', this)">🎾 Tennis</button>
    <button class="sport-pill" onclick="filterSports('crypto', this)">📈 Crypto / Finance</button>
  </nav>

  <main class="main-content">
    <section id="match-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 0.85rem;" id="loader">
        Initializing Live Connection...
      </div>
    </section>
  </main>

  <script>
    const MARKET_API = "https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=25&order=volume24hr&ascending=false";
    const WS_URL = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

    let socket;
    let trackedTokens = [];
    let marketsData = [];
    let pingTime = 0;

    async function loadData() {
      try {
        const res = await fetch(MARKET_API);
        marketsData = await res.json();
        
        document.getElementById('loader').style.display = 'none';
        renderList('all');
        initWS();
      } catch (e) {
        console.error(e);
        document.getElementById('loader').innerText = "Connecting fallback engine...";
        setTimeout(loadData, 2000);
      }
    }

    function renderList(category) {
      const container = document.getElementById('match-list');
      container.innerHTML = '';
      trackedTokens = [];

      let found = 0;

      marketsData.forEach(item => {
        let tokens = [];
        try {
          tokens = typeof item.clobTokenIds === 'string' ? JSON.parse(item.clobTokenIds) : item.clobTokenIds;
        } catch(err) { tokens = []; }

        let prices = [0.5, 0.5];
        try {
          prices = typeof item.outcomePrices === 'string' ? JSON.parse(item.outcomePrices) : item.outcomePrices;
        } catch(err) { prices = [0.5, 0.5]; }

        if (tokens && tokens.length >= 2) {
          const yesId = tokens[0];
          const noId = tokens[1];

          const q = (item.question || item.groupItemTitle || "").toLowerCase();

          if (category !== 'all') {
            if (!q.includes(category)) return;
          }

          found++;
          trackedTokens.push(yesId, noId);

          const card = document.createElement('div');
          card.className = 'match-card';

          const p1 = (parseFloat(prices[0] || 0.5)).toFixed(2);
          const p2 = (parseFloat(prices[1] || 0.5)).toFixed(2);

          card.innerHTML = `
            <div class="match-info">
              <div class="match-title">${item.question || 'Live Market'}</div>
              <div class="match-subtitle">Polymarket Direct Odds</div>
            </div>
            <div class="odds-group">
              <button class="odds-btn odds-yes" id="btn-${yesId}">${p1}</button>
              <button class="odds-btn odds-no" id="btn-${noId}">${p2}</button>
            </div>
          `;

          container.appendChild(card);
        }
      });

      if (found === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 40px 0;">No active events found in this category right now.</div>`;
      }
    }

    function filterSports(cat, el) {
      document.querySelectorAll('.sport-pill').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderList(cat);

      if (socket && socket.readyState === WebSocket.OPEN && trackedTokens.length > 0) {
        socket.send(JSON.stringify({
          type: "market",
          assets_ids: trackedTokens
        }));
      }
    }

    function initWS() {
      if (socket) socket.close();

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot online';

        if (trackedTokens.length > 0) {
          socket.send(JSON.stringify({
            type: "market",
            assets_ids: trackedTokens
          }));
        }
        startLatencyCounter();
      };

      socket.onmessage = (msg) => {
        const data = JSON.parse(msg.data);

        // Record ping latency
        if (pingTime > 0) {
          const lat = Math.round(performance.now() - pingTime);
          document.getElementById('latency-val').innerText = lat;
          pingTime = 0;
        }

        if (data.asset_id && data.price) {
          updatePrice(data.asset_id, data.price);
        }
      };

      socket.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot offline';
        setTimeout(initWS, 2000);
      };

      socket.onerror = () => {
        document.getElementById('ws-dot').className = 'status-dot offline';
      };
    }

    function updatePrice(assetId, priceVal) {
      const btn = document.getElementById(`btn-${assetId}`);
      if (btn) {
        const oldP = parseFloat(btn.innerText) || 0;
        const newP = parseFloat(priceVal);

        if (newP !== oldP) {
          btn.innerText = newP.toFixed(2);
          const flash = newP > oldP ? 'flash-up' : 'flash-down';
          btn.classList.remove('flash-up', 'flash-down');
          void btn.offsetWidth;
          btn.classList.add(flash);
        }
      }
    }

    function startLatencyCounter() {
      setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          pingTime = performance.now();
          socket.send(JSON.stringify({ type: "ping" }));
        }
      }, 3000);
    }

    loadData();
  </script>
</body>
</html>
