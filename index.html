
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- iPhone viewport meta tag for full-width notch compatibility -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Polymarket Live Sports Odds</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #2563eb;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
      --odds-blue: #1d4ed8;
      --odds-pink: #be123c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* iPhone Fixed Glassmorphism Top Bar */
    .top-header {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Latency & Status Badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
    }
    .status-dot.online { background-color: var(--green); }
    .status-dot.offline { background-color: var(--red); }

    /* Sports Pills Filter Bar (Horizontal Scroll) */
    .sports-nav {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--card-border);
    }
    .sports-nav::-webkit-scrollbar { display: none; }

    .sport-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .sport-pill.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* Match Cards */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .match-card:active {
      background-color: #1f2937;
    }

    .match-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .match-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .match-subtitle {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Polymarket Buttons */
    .odds-group {
      display: flex;
      gap: 6px;
    }

    .odds-btn {
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      color: white;
      border: none;
      min-width: 58px;
      text-align: center;
      min-height: 44px; /* Touch target optimized */
      transition: background-color 0.4s ease, transform 0.2s ease;
    }

    .odds-yes { background-color: var(--odds-blue); }
    .odds-no { background-color: var(--odds-pink); }

    /* WebSocket Flashes */
    .flash-up { animation: flashGreen 0.6s ease; }
    .flash-down { animation: flashRed 0.6s ease; }

    @keyframes flashGreen {
      0% { background-color: var(--green); transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes flashRed {
      0% { background-color: var(--red); transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Mobile Bottom Drawer / Slide-Up Panel */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--card-border);
      padding: 20px 16px 30px 16px;
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.active .drawer-panel {
      transform: translateY(0);
    }

    .drawer-handle {
      width: 36px;
      height: 4px;
      background: var(--card-border);
      border-radius: 2px;
      margin: 0 auto 16px auto;
    }

    /* iPad / Desktop Layout Switcher */
    @media (min-width: 768px) {
      .main-content {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }
      .drawer-overlay { display: none !important; }
      .desktop-panel {
        display: block !important;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 16px;
      }
    }

    @media (max-width: 767px) {
      .desktop-panel { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header Bar -->
  <header class="top-header">
    <div class="brand">⚡ Polymarket Odds</div>
    <div class="status-badge">
      <div class="status-dot" id="ws-dot"></div>
      <span id="latency-val">--</span>ms
    </div>
  </header>

  <!-- Sports Navigation Scroll Bar -->
  <nav class="sports-nav">
    <button class="sport-pill active">🔥 All Sports</button>
    <button class="sport-pill">🏏 Cricket</button>
    <button class="sport-pill">⚽ Football</button>
    <button class="sport-pill">🎾 Tennis</button>
    <button class="sport-pill">🥊 MMA</button>
  </nav>

  <!-- Main Scroll View -->
  <main class="main-content">
    
    <!-- Live Match Items List -->
    <section id="match-list">
      <div style="text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 0.85rem;">
        Connecting to Polymarket Live Stream...
      </div>
    </section>

    <!-- Desktop Detail View Panel (Visible on iPad/Desktop) -->
    <aside class="desktop-panel">
      <h3 id="desk-title" style="font-size: 1rem; margin-bottom: 8px;">Match Details</h3>
      <p id="desk-subtitle" style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 16px;">Select an event from the list</p>
      
      <div style="background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border);">
        <div style="font-size: 0.8rem; font-weight: 600; margin-bottom: 10px;">Direct Polymarket Odds</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>YES</span>
          <button class="odds-btn odds-yes" id="desk-yes">--</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <span>NO</span>
          <button class="odds-btn odds-no" id="desk-no">--</button>
        </div>
      </div>
    </aside>

  </main>

  <!-- iPhone Bottom Drawer Modal -->
  <div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
    <div class="drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-handle"></div>
      <h3 id="mobile-title" style="font-size: 1rem; margin-bottom: 4px;">--</h3>
      <p style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 16px;">Polymarket Live Stream</p>

      <div style="background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid var(--card-border);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-weight: 600; font-size: 0.9rem;">YES Outcome</span>
          <button class="odds-btn odds-yes" id="mobile-yes">--</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 600; font-size: 0.9rem;">NO Outcome</span>
          <button class="odds-btn odds-no" id="mobile-no">--</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAMMA_API = "https://gamma-api.polymarket.com/events?limit=15&closed=false&tag_id=100688";
    const WS_URL = "wss://ws-subscriptions-clob.polymarket.com/ws/market";

    let socket;
    let trackedAssetIds = [];
    let pingStartTime = 0;

    async function fetchSportsMarkets() {
      try {
        const response = await fetch(GAMMA_API);
        const events = await response.json();
        
        const listContainer = document.getElementById('match-list');
        listContainer.innerHTML = '';

        events.forEach(event => {
          if (!event.markets || event.markets.length === 0) return;

          event.markets.forEach(market => {
            const clobTokens = JSON.parse(market.clobTokenIds || "[]");
            const outcomePrices = JSON.parse(market.outcomePrices || "[\"0\", \"0\"]");

            if (clobTokens.length >= 2) {
              const yesId = clobTokens[0];
              const noId = clobTokens[1];

              trackedAssetIds.push(yesId, noId);

              const card = document.createElement('div');
              card.className = 'match-card';
              card.onclick = () => openMatchDetails(market.question || event.title, yesId, noId);

              card.innerHTML = `
                <div class="match-info">
                  <div class="match-title">${market.question || event.title}</div>
                  <div class="match-subtitle">${event.title}</div>
                </div>
                <div class="odds-group">
                  <button class="odds-btn odds-yes" id="btn-${yesId}">
                    ${parseFloat(outcomePrices[0]).toFixed(2)}
                  </button>
                  <button class="odds-btn odds-no" id="btn-${noId}">
                    ${parseFloat(outcomePrices[1]).toFixed(2)}
                  </button>
                </div>
              `;

              listContainer.appendChild(card);
            }
          });
        });

        connectWebSocket();

      } catch (err) {
        console.error("Error fetching Polymarket sports:", err);
      }
    }

    function connectWebSocket() {
      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot online';
        socket.send(JSON.stringify({
          type: "market",
          assets_ids: trackedAssetIds
        }));
        measureLatency();
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (pingStartTime > 0) {
          const latency = Math.round(performance.now() - pingStartTime);
          document.getElementById('latency-val').innerText = latency;
          pingStartTime = 0;
        }

        if (data.event_type === "price_change" || data.event_type === "book") {
          updateOdds(data);
        }
      };

      socket.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot offline';
        setTimeout(connectWebSocket, 3000);
      };
    }

    function updateOdds(data) {
      if (!data.asset_id || !data.price) return;

      const btn = document.getElementById(`btn-${data.asset_id}`);
      if (btn) {
        const oldPrice = parseFloat(btn.innerText) || 0;
        const newPrice = parseFloat(data.price);

        if (newPrice !== oldPrice) {
          btn.innerText = newPrice.toFixed(2);
          const flashClass = newPrice > oldPrice ? 'flash-up' : 'flash-down';
          btn.classList.remove('flash-up', 'flash-down');
          void btn.offsetWidth;
          btn.classList.add(flashClass);
        }
      }
    }

    function measureLatency() {
      if (socket && socket.readyState === WebSocket.OPEN) {
        pingStartTime = performance.now();
        socket.send("PING");
      }
      setTimeout(measureLatency, 3000);
    }

    function openMatchDetails(title, yesId, noId) {
      const yesVal = document.getElementById(`btn-${yesId}`)?.innerText || "--";
      const noVal = document.getElementById(`btn-${noId}`)?.innerText || "--";

      // Mobile Drawer View
      document.getElementById('mobile-title').innerText = title;
      document.getElementById('mobile-yes').innerText = yesVal;
      document.getElementById('mobile-no').innerText = noVal;
      document.getElementById('drawer').classList.add('active');

      // Desktop Panel View
      document.getElementById('desk-title').innerText = title;
      document.getElementById('desk-yes').innerText = yesVal;
      document.getElementById('desk-no').innerText = noVal;
    }

    function closeDrawer(e) {
      document.getElementById('drawer').classList.remove('active');
    }

    fetchSportsMarkets();
  </script>
</body>
</html>
