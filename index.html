
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>Crystal Edge — Live Sports</title>
<style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#101a2d;--line:#22314b;--muted:#91a2bd;--text:#f0f5ff;--blue:#4b91ff;--red:#ff607c;--green:#36d6a0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 10% 0%,#152950 0,transparent 38%),var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
header{padding:22px 16px 15px;position:sticky;top:0;z-index:5;background:#080d1bf2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:21px;letter-spacing:1.4px}.logo span{color:var(--blue)}
.sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:5px}
.status{font-size:11px;color:var(--muted);text-align:right}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{background:#111d32;border:1px solid var(--line);padding:10px;border-radius:12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:1px;margin-bottom:7px}
.stat strong{font-size:15px;overflow-wrap:anywhere}
.controls{padding:14px 12px 8px}
.sports,.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.sports::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#111b2e;border:1px solid var(--line);border-radius:20px;padding:10px 13px;color:#b7c5dc;font-size:12px}
.chip.active{background:#1b3a68;border-color:var(--blue);color:white}
.filters .chip{padding:8px 12px;font-size:11px}
.searchrow{display:flex;gap:8px;margin:8px 0}
.searchrow input{width:100%;min-width:0;border:1px solid var(--line);background:#101a2d;color:white;padding:12px;border-radius:11px;outline:none}
.action{border:1px solid var(--line);background:#14223a;border-radius:10px;padding:10px 12px}
.action:active,.chip:active{transform:scale(.98)}
.info{padding:3px 15px 12px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px}
main{padding:0 12px 50px}
.sectiontitle{font-size:12px;letter-spacing:1.4px;color:#9fb4d4;margin:8px 3px 12px;text-transform:uppercase}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.match{border:1px solid #263956;background:linear-gradient(140deg,#121e34,#0d1526 75%);border-radius:17px;padding:14px;box-shadow:0 8px 28px #0002;min-width:0}
.matchtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}
.league{color:#a8bad6;font-size:10px;letter-spacing:.7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:9px;border:1px solid #304766;border-radius:20px;padding:5px 7px;color:#bcd2f1;white-space:nowrap}
.teams{font-size:17px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;margin:5px 0 12px}
.vs{color:#6e88ae;font-size:11px;margin:0 5px}
.marketmeta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.sourcegrid{display:grid;grid-template-columns:1fr;gap:8px}
.source{border-radius:12px;padding:10px;background:#101e33;border:1px solid #24416a}
.sourcehead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
.sourcehead b{font-size:11px;letter-spacing:.6px}.sourcehead span{font-size:9px;color:var(--muted)}
.source.poly{border-color:#28559a;background:linear-gradient(120deg,#102c51,#111d32)}
.quotehead,.quote{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px;gap:6px;align-items:center}
.quotehead{color:#8fa4c2;font-size:9px;margin-bottom:6px}
.quote{margin-top:5px;font-size:11px}
.teamlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{border-radius:7px;text-align:center;padding:8px 3px;font-weight:800;font-variant-numeric:tabular-nums;background:#173c66;color:#bfe0ff;min-width:0}
.price.sell{background:#482331;color:#ffc1cd}
.price.na{background:#182235;color:#71839f;font-weight:500}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.cardfoot small{font-size:10px;color:var(--muted)}
.openbtn{border:1px solid #3864a0;border-radius:9px;background:#17335a;padding:9px 12px;font-size:11px;font-weight:700}
.empty{padding:35px 16px;border:1px dashed #2b3b55;border-radius:15px;text-align:center;color:var(--muted);line-height:1.7}
#more{display:block;width:100%;margin-top:15px;padding:13px}
#error{display:none;margin:8px 12px;padding:12px;border:1px solid #7c3b4a;border-radius:12px;background:#321925;color:#ffd2dc;font-size:12px;line-height:1.5}
#detail{display:none;position:fixed;inset:0;z-index:20;background:#080d1b;overflow-y:auto;padding:env(safe-area-inset-top) 12px 30px}
.detailhead{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid var(--line);margin-bottom:15px}
.detailhead h2{font-size:17px;margin:0;flex:1;line-height:1.4}
.detailnote{font-size:11px;color:var(--muted);line-height:1.6;margin:10px 0 16px}
.marketdetail{padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.marketdetail h3{font-size:13px;margin:0 0 10px}
.detailoutcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.outcome{background:#0b1425;border:1px solid #263650;border-radius:9px;padding:9px;min-width:0}
.outcome b{font-size:11px;display:block;overflow-wrap:anywhere;margin-bottom:7px}
.outcome .quote{grid-template-columns:1fr 1fr}
.outcome .price{font-size:11px}
.footer{text-align:center;color:#657b9d;font-size:10px;padding:25px 10px}
@media(min-width:680px){main{max-width:1000px;margin:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.sourcegrid{grid-template-columns:1fr}.match{padding:15px}.controls{max-width:1000px;margin:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div>
      <div class="logo">◇ CRYSTAL <span>EDGE</span></div>
      <div class="sub">POLYMARKET · LIVE SPORTS</div>
    </div>
    <div class="status"><span class="dot"></span><span id="connection">Connecting</span><br><span id="updated">Waiting for data</span></div>
  </div>
  <div class="stats">
    <div class="stat"><small>EVENTS LOADED</small><strong id="eventCount">0</strong></div>
    <div class="stat"><small>SPORTS MATCHES</small><strong id="matchCount">0</strong></div>
    <div class="stat"><small>LAST REQUEST</small><strong id="latency">—</strong></div>
  </div>
</header>

<div class="controls">
  <div class="sports" id="sports">
    <button class="chip active" data-sport="all">🌐 All Sports</button>
    <button class="chip" data-sport="cricket">🏏 Cricket</button>
    <button class="chip" data-sport="football">⚽ Football</button>
    <button class="chip" data-sport="tennis">🎾 Tennis</button>
    <button class="chip" data-sport="basketball">🏀 Basketball</button>
    <button class="chip" data-sport="mma">🥊 MMA</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All matches</button>
    <button class="chip" data-filter="live">🔴 Live now</button>
    <button class="chip" data-filter="today">Today</button>
    <button class="chip" data-filter="tomorrow">Tomorrow</button>
    <button class="chip" data-filter="upcoming">Upcoming</button>
  </div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search teams, players or leagues…">
    <button class="action" id="refresh">↻</button>
  </div>
</div>

<div class="info"><span id="resultInfo">Loading sports events…</span><span id="pageInfo">Page 1</span></div>
<div id="error"></div>
<main>
  <div class="sectiontitle">Matches &amp; live exchange prices</div>
  <div class="cards" id="cards"></div>
  <button class="action" id="more">Load more matches</button>
  <div class="footer">Crystal Edge · Real Polymarket public market data · No fabricated odds</div>
</main>

<div id="detail">
  <div class="detailhead">
    <button class="action" id="closeDetail">← Back</button>
    <h2 id="detailTitle">Match details</h2>
  </div>
  <div class="detailnote" id="detailMeta"></div>
  <div id="detailMarkets"></div>
</div>

<script>
(() => {
'use strict';

const WORKER = 'https://crystal-odds-api.karanarora082000.workers.dev';
const CLOB = 'https://clob.polymarket.com';
const PAGE_SIZE = 100;
const MAX_PAGES_PER_LOAD = 4;
const BOOK_REFRESH_MS = 25000;

const $ = id => document.getElementById(id);
const state = {
  events: [], offset: 0, more: true, loading: false,
  sport: 'all', filter: 'all', search: '',
  books: new Map(), bookPending: new Set(), page: 0,
  detailEvent: null, detailBooks: new Map()
};

const FINANCE = /\b(bitcoin|btc|ethereum|eth|solana|crypto|cryptocurrency|gold|silver|crude oil|nasdaq|s&p ?500|dow jones|stock market|share price|fed rate|interest rate|inflation|recession|presidential election|election winner|trump wins|weather in|temperature in|rainfall|highest temperature|lowest temperature)\b/i;
const FUTURES = /\b(champion|winner|outright|season winner|league winner|tournament winner|to win the league|mvp|ballon d.or|top scorer|relegation|qualify for|group winner|draft pick|rookie of the year)\b/i;
const VS = /\b(vs\.?|versus|v\.|@)\b/i;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function arr(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string') {
    try { const x = JSON.parse(v); return Array.isArray(x) ? x : []; }
    catch { return []; }
  }
  return [];
}
function textOf(e) {
  const tags = arr(e?.tags).map(t => typeof t === 'string' ? t : (t?.label || t?.name || t?.slug || '')).join(' ');
  const categories = arr(e?.categories).map(t => typeof t === 'string' ? t : (t?.label || t?.name || t?.slug || '')).join(' ');
  return [
    e?.title, e?.name, e?.slug, e?.description, e?.category,
    e?.sport, e?.seriesSlug, e?.league, e?.competition, tags, categories
  ].filter(Boolean).join(' ');
}
function eventTitle(e) {
  return String(e?.title || e?.name || e?.eventTitle || e?.slug || 'Untitled event').trim();
}

function marketTokens(m) {
  const raw =
    m?.clobTokenIds ??
    m?.clob_token_ids ??
    m?.tokenIds ??
    m?.token_ids ??
    m?.tokens ??
    m?.positionIds ??
    m?.token_id ??
    [];

  if (Array.isArray(raw)) return raw.map(String).filter(Boolean);

  if (typeof raw === "string") {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
    } catch {}
    return raw.trim() ? [raw.trim()] : [];
  }

  return [];
}

function isActualMatch(e) {
  const title = String(e?.title || e?.name || e?.eventTitle || "");
  if (!title) return false;

  // Reject financial markets using the event title only.
  if (/\b(bitcoin|ethereum|crypto|gold|silver|nasdaq|s&p 500|dow jones|stock price|oil price|fed rate|inflation)\b/i.test(title)) {
    return false;
  }

  // Actual match titles usually name both competitors.
  const separator = /\s+(?:vs\.?|versus|v\.)\s+/i;
  if (!separator.test(title)) return false;

  const sides = title.split(separator).filter(x => x.trim().length > 1);
  if (sides.length < 2) return false;

  // Do not reject an event solely because the Worker omitted token IDs.
  // Its real market availability will be checked when opening the event.
  const markets = Array.isArray(e?.markets) ? e.markets : [];
  return markets.length > 0;
}

function sportOf(e) {
  const title = String(e?.title || e?.name || "");
  const metadata = [
    e?.sport,
    e?.category,
    e?.seriesSlug,
    e?.league,
    e?.slug
  ].filter(Boolean).join(" ").toLowerCase();

  // Use event metadata and title, not the entire description or market list.
  const s = (metadata + " " + title).toLowerCase();

  if (/\b(cricket|ipl|t20|odi|ashes|big bash|the hundred|wpl)\b/i.test(s)) return "cricket";
  if (/\b(basketball|nba|wnba|euroleague|ncaab)\b/i.test(s)) return "basketball";
  if (/\b(tennis|atp|wta|wimbledon|roland garros|challenger tour)\b/i.test(s)) return "tennis";
  if (/\b(mma|ufc|bellator|pfl|mixed martial arts)\b/i.test(s)) return "mma";
  if (/\b(football|soccer|premier league|champions league|la liga|serie a|bundesliga|ligue 1|mls|fa cup|europa league|eredivisie)\b/i.test(s)) return "football";

  return null;
}
function parseDate(e) {
  const value = e?.startDate || e?.start_date || e?.gameStartTime ||
    e?.startTime || e?.eventDate || e?.date || e?.endDate || null;
  if (!value) return null;
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}
function statusOf(e) {
  const t = (eventTitle(e) + ' ' + textOf(e)).toLowerCase();
  if (e?.live === true || e?.isLive === true || /\blive\b/.test(t)) return 'LIVE';
  const d = parseDate(e);
  if (d && d.getTime() < Date.now() && Date.now() - d.getTime() < 5*60*60*1000) return 'STARTED';
  return 'UPCOMING';
}
function eventId(e) {
  return String(e?.id || e?.eventId || e?.slug || eventTitle(e));
}
function dedupe(events) {
  const map = new Map();
  for (const e of events) {
    if (!e || typeof e !== 'object') continue;
    map.set(eventId(e), e);
  }
  return [...map.values()];
}
function unwrapEvents(json) {
  if (Array.isArray(json)) return json;
  if (!json || typeof json !== 'object') return [];
  const candidates = [
    json.events, json.data?.events, json.data, json.results,
    json.markets, json.data?.results, json.items
  ];
  for (const v of candidates) {
    if (Array.isArray(v)) return v;
  }
  // Some proxy versions return Gamma's object inside a wrapper.
  if (json.result && Array.isArray(json.result.events)) return json.result.events;
  return [];
}
async function fetchEventsPage(offset) {
  const base = String(WORKER || '').replace(/\/+$/, '');
  const url = `${base}/polymarket?type=events&limit=${PAGE_SIZE}&offset=${offset}`;
  const started = performance.now();

  let response;
  try {
    response = await fetch(url, {
      method: 'GET',
      cache: 'no-store',
      mode: 'cors',
      headers: { 'Accept': 'application/json' }
    });
  } catch (err) {
    throw new Error(
      `Network/CORS request failed at offset ${offset}. ` +
      `Check WORKER URL and browser access. Details: ${err?.message || err}`
    );
  }

  const elapsed = Math.round(performance.now() - started);

  if (!response.ok) {
    throw new Error(`Worker returned HTTP ${response.status} at offset ${offset}`);
  }

  let json;
  try {
    json = await response.json();
  } catch (err) {
    throw new Error(`Worker response was not valid JSON at offset ${offset}`);
  }

  if (json?.success === false) {
    throw new Error(json.error || json.message || 'Worker reported an error');
  }

  const events = unwrapEvents(json);

  if (!Array.isArray(events)) {
    throw new Error('Worker JSON received, but event list could not be recognized');
  }

  return { events, elapsed, json };
}

function localDateKey(d) {
  if (!d) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function filterEvents() {
  const now = new Date();
  const today = localDateKey(now);
  const tomorrowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const tomorrow = localDateKey(tomorrowDate);
  const query = state.search.trim().toLowerCase();

  return allEligible().filter(e => {
    const sport = sportOf(e);
    if (state.sport !== 'all' && sport !== state.sport) return false;

    const d = parseDate(e);
    if (state.filter === 'live' && statusOf(e) !== 'LIVE' && statusOf(e) !== 'STARTED') return false;
    if (state.filter === 'today' && (!d || localDateKey(d) !== today)) return false;
    if (state.filter === 'tomorrow' && (!d || localDateKey(d) !== tomorrow)) return false;
    if (state.filter === 'upcoming' && (!d || d.getTime() < now.getTime())) return false;

    if (query && !(eventTitle(e) + ' ' + textOf(e)).toLowerCase().includes(query)) return false;
    return true;
  }).sort((a,b) => {
    const sa = statusOf(a) === 'LIVE' ? 0 : 1;
    const sb = statusOf(b) === 'LIVE' ? 0 : 1;
    if (sa !== sb) return sa - sb;
    const da = parseDate(a)?.getTime() ?? Infinity;
    const db = parseDate(b)?.getTime() ?? Infinity;
    return da - db;
  });
}
function splitTeams(title) {
  const parts = title.split(/\s+(?:vs\.?|versus|v\.|@)\s+/i);
  return parts.length >= 2 ? [parts[0].trim(), parts.slice(1).join(' vs ').trim()] : [title, ''];
}
function fmtTime(d) {
  if (!d) return 'Start time unavailable';
  return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function decimal(price) {
  const p = Number(price);
  if (!Number.isFinite(p) || p <= 0 || p >= 1) return null;
  return (1/p).toFixed(2);
}
function getTokenForOutcome(m, index) {
  const ids = marketTokens(m);
  return ids[index] ? String(ids[index]) : null;
}
function outcomeNames(m) {
  let outcomes = arr(m?.outcomes);
  if (!outcomes.length && typeof m?.outcomes === 'string') {
    try { outcomes = JSON.parse(m.outcomes); } catch {}
  }
  return outcomes.map(o => typeof o === 'string' ? o : (o?.name || o?.title || 'Outcome'));
}
function getBook(token, cache=state.books) {
  return cache.get(String(token)) || null;
}
function bookPrices(book) {
  if (!book) return {buy:null,sell:null};
  const asks = arr(book.asks).map(x => Number(x.price)).filter(p => p > 0 && p < 1);
  const bids = arr(book.bids).map(x => Number(x.price)).filter(p => p > 0 && p < 1);
  // Best ask is the lowest price to buy; best bid is the highest price to sell.
  return {
    buy: asks.length ? decimal(Math.min(...asks)) : null,
    sell: bids.length ? decimal(Math.max(...bids)) : null
  };
}
function quoteMarkup(token, cache=state.books) {
  const p = bookPrices(getBook(token,cache));
  return `<div class="quotehead"><span></span><span>BUY</span><span>SELL</span></div>
    <div class="quote"><span class="teamlabel">Decimal odds</span>
      <span class="price">${p.buy || '—'}</span>
      <span class="price sell">${p.sell || '—'}</span>
    </div>`;
}
function firstTwoOutcomes(e) {
  for (const m of eventMarkets(e)) {
    if (!activeMarket(m)) continue;
    const names = outcomeNames(m);
    const ids = marketTokens(m);
    if (ids.length >= 2) {
      return [
        {name:names[0] || splitTeams(eventTitle(e))[0], token:ids[0]},
        {name:names[1] || splitTeams(eventTitle(e))[1], token:ids[1]}
      ];
    }
  }
  return [];
}
function cardMarkup(e) {
  const title = eventTitle(e);
  const [teamA,teamB] = splitTeams(title);
  const outcomes = firstTwoOutcomes(e);
  const sport = sportOf(e);
  const status = statusOf(e);
  const live = status === 'LIVE';
  const time = fmtTime(parseDate(e));
  const league = e?.league || e?.seriesSlug || e?.category || sport.toUpperCase();
  const tokens = outcomes.map(o => o.token);
  return `<article class="match" data-event="${esc(eventId(e))}">
    <div class="matchtop"><span class="league">${esc(String(league).replace(/[-_]/g,' '))}</span>
      <span class="tag">${live ? '🔴 LIVE' : esc(status)}</span></div>
    <div class="teams">${esc(teamA)} <span class="vs">VS</span> ${esc(teamB)}</div>
    <div class="marketmeta"><span>${esc(sport.toUpperCase())}</span><span>${esc(time)}</span></div>
    <div class="sourcegrid"><div class="source poly">
      <div class="sourcehead"><b>◇ POLYMARKET CLOB</b><span>DECIMAL ODDS</span></div>
      <div class="quotehead"><span>OUTCOME</span><span>BUY</span><span>SELL</span></div>
      ${outcomes.length ? outcomes.map(o => {
        const p = bookPrices(getBook(o.token));
        return `<div class="quote"><span class="teamlabel" title="${esc(o.name)}">${esc(o.name)}</span>
          <span class="price">${p.buy || '—'}</span><span class="price sell">${p.sell || '—'}</span></div>`;
      }).join('') : '<div class="quote"><span class="teamlabel">No token IDs</span><span class="price na">—</span><span class="price na">—</span></div>'}
    </div></div>
    <div class="cardfoot"><small>${tokens.length ? 'Public order book · ' + tokens.length + ' outcomes' : 'No CLOB tokens returned'}</small>
      <button class="openbtn" data-open="${esc(eventId(e))}">Match details ↗</button></div>
  </article>`;
}
function render() {
  const eligible = allEligible();
  const visible = filterEvents();
  console.log('DEBUG', { sport: state.sport, filter: state.filter, search: state.search, eligible: eligible.length, visible: visible.length });
$('resultInfo').textContent = `DEBUG: ${state.sport} / ${state.filter} · ${eligible.length} eligible / ${visible.length} visible`;
  $('eventCount').textContent = state.events.length.toLocaleString();
  $('matchCount').textContent = eligible.length.toLocaleString();
  $('resultInfo').textContent = `${visible.length} matching events · real sports matches only`;
  $('pageInfo').textContent = `Pages loaded: ${state.page}`;
  $('cards').innerHTML = visible.length
    ? visible.map(cardMarkup).join('')
    : `<div class="empty">No matching sports matches found yet.<br>Try <b>All Sports</b>, clear the search, or load more events.<br><br>Only events with a team-vs-team title and active tokenized markets are shown.</div>`;
  $('more').textContent = state.loading ? 'Loading…' : state.more ? 'Load more matches' : 'No more event pages';
  $('more').disabled = state.loading || !state.more;
  requestVisibleBooks(visible.slice(0,24));
}
function showError(message) {
  $('error').style.display = 'block';
  $('error').textContent = message;
}
function clearError() {
  $('error').style.display = 'none';
  $('error').textContent = '';
}
async function loadMore() {
  if (state.loading || !state.more) return;
  state.loading = true;
  $('connection').textContent = 'Loading';
  clearError();
  render();
  try {
    let addedPages = 0;
    while (state.more && addedPages < MAX_PAGES_PER_LOAD) {
      const {events,elapsed,json} = await fetchEventsPage(state.offset);
      $('latency').textContent = `${elapsed} ms`;
      $('connection').textContent = 'Worker connected';
      if (!events.length) {
        state.more = false;
        if (!state.events.length) {
          const keys = json && typeof json === 'object' ? Object.keys(json).join(', ') : 'unknown';
          showError(`Worker responded, but no event array was recognized. Response keys: ${keys || 'none'}. Check that the Worker supports /polymarket?type=events&limit=100&offset=0.`);
        }
        break;
      }
      const before = state.events.length;
      state.events = dedupe(state.events.concat(events));
      state.offset += events.length;
      state.page++;
      addedPages++;
      if (state.events.length === before) {
  state.more = false;
}
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    $('connection').textContent = 'Worker error';
    showError(`Could not load events: ${err.message}. Check your Worker URL and its /polymarket?type=events endpoint.`);
  } finally {
    state.loading = false;
    render();
  }
}
async function fetchBook(token, cache=state.books) {
  token = String(token || '');
  if (!token || cache.has(token)) return;
  const key = (cache === state.detailBooks ? 'detail:' : 'card:') + token;
  if (state.bookPending.has(key)) return;
  state.bookPending.add(key);
  try {
    const res = await fetch(`${CLOB}/book?token_id=${encodeURIComponent(token)}`, {cache:'no-store'});
    if (!res.ok) throw new Error(`CLOB ${res.status}`);
    const book = await res.json();
    // Only cache a full order-book response. Never append incremental price changes.
    if (book && (Array.isArray(book.bids) || Array.isArray(book.asks))) cache.set(token,book);
  } catch (err) {
    // CLOB may block direct browser requests. Leave odds blank rather than invent prices.
    cache.set(token, null);
  } finally {
    state.bookPending.delete(key);
  }
}
async function requestVisibleBooks(events) {
  const tokens = new Set();
  for (const e of events) for (const o of firstTwoOutcomes(e)) tokens.add(String(o.token));
  const tasks = [...tokens].filter(t => !state.books.has(t)).slice(0,36).map(t => fetchBook(t));
  if (!tasks.length) return;
  await Promise.allSettled(tasks);
  renderCardsOnly();
}
function renderCardsOnly() {
  const visible = filterEvents();
  $('cards').innerHTML = visible.length
    ? visible.map(cardMarkup).join('')
    : `<div class="empty">No matching sports matches found yet.<br>Try All Sports or load more events.</div>`;
}
function marketLabel(m) {
  return String(m?.question || m?.groupItemTitle || m?.title || m?.slug || 'Market');
}
async function openDetail(id) {
  const e = state.events.find(x => eventId(x) === id);
  if (!e) return;
  state.detailEvent = e;
  state.detailBooks = new Map();
  $('detailTitle').textContent = eventTitle(e);
  $('detailMeta').textContent = `${String(sportOf(e) || 'SPORT').toUpperCase()} · ${fmtTime(parseDate(e))} · Prices are decimal odds calculated from the public CLOB order book.`;
  $('detailMarkets').innerHTML = '<div class="empty">Loading market order books…</div>';
  $('detail').style.display = 'block';
  document.body.style.overflow = 'hidden';

  const markets = eventMarkets(e).filter(m => m && m.active !== false && m.closed !== true);
  if (!markets.length) {
    $('detailMarkets').innerHTML = '<div class="empty">No active markets returned for this event.</div>';
    return;
  }
  $('detailMarkets').innerHTML = markets.map((m,i) => {
    const names = outcomeNames(m);
    const ids = marketTokens(m);
    const outs = ids.map((token,j) => ({token:yString(token),name:names[j] || `Outcome ${j+1}`}));
    return `<section class="marketdetail" data-market-index="${i}">
      <h3>${esc(marketLabel(m))}</h3>
      <div class="detailoutcomes">${outs.map(o => {
        const p = bookPrices(getBook(o.token,state.detailBooks));
        return `<div class="outcome"><b>${esc(o.name)}</b>
          <div class="quote"><span class="price">${p.buy || '—'} BUY</span><span class="price sell">${p.sell || '—'} SELL</span></div>
        </div>`;
      }).join('') || '<div class="detailnote">No token IDs available for this market.</div>'}</div>
    </section>`;
  }).join('');

  const tokens = [...new Set(markets.flatMap(m => marketTokens(m).map(String)))].slice(0,60);
  await Promise.allSettled(tokens.map(t => fetchBook(t,state.detailBooks)));
  if (state.detailEvent && eventId(state.detailEvent) === id) {
    $('detailMarkets').innerHTML = markets.map(m => {
      const names = outcomeNames(m);
      const ids = marketTokens(m);
      const outs = ids.map((token,j) => ({token:String(token),name:names[j] || `Outcome ${j+1}`}));
      return `<section class="marketdetail"><h3>${esc(marketLabel(m))}</h3>
        <div class="detailoutcomes">${outs.map(o => {
          const p = bookPrices(getBook(o.token,state.detailBooks));
          return `<div class="outcome"><b>${esc(o.name)}</b>
            <div class="quote"><span class="price">${p.buy || '—'} BUY</span><span class="price sell">${p.sell || '—'} SELL</span></div>
          </div>`;
        }).join('') || '<div class="detailnote">No token IDs available for this market.</div>'}</div></section>`;
    }).join('');
  }
}
function closeDetail() {
  $('detail').style.display = 'none';
  document.body.style.overflow = '';
  state.detailEvent = null;
}
$('sports').addEventListener('click',e => {
  const b = e.target.closest('[data-sport]');
  if (!b) return;
  state.sport = b.dataset.sport;
  $('sports').querySelectorAll('.chip').forEach(x => x.classList.toggle('active',x === b));
  render();
});
$('filters').addEventListener('click',e => {
  const b = e.target.closest('[data-filter]');
  if (!b) return;
  state.filter = b.dataset.filter;
  $('filters').querySelectorAll('.chip').forEach(x => x.classList.toggle('active',x === b));
  render();
});
$('cards').addEventListener('click',e => {
  const b = e.target.closest('[data-open]');
  if (b) openDetail(b.dataset.open);
  else {
    const card = e.target.closest('[data-event]');
    if (card) openDetail(card.dataset.event);
  }
});
$('search').addEventListener('input',e => {
  state.search = e.target.value;
  render();
});
$('refresh').addEventListener('click',async () => {
  state.events = [];
  state.offset = 0;
  state.more = true;
  state.page = 0;
  state.books.clear();
  await loadMore();
});
$('more').addEventListener('click',loadMore);
$('closeDetail').addEventListener('click',closeDetail);
$('detail').addEventListener('click',e => {
  if (e.target === $('detail')) closeDetail();
});

loadMore();
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  // Refresh visible CLOB books only; don't erase a valid book until a new response arrives.
  const visible = filterEvents().slice(0,24);
  const tokens = new Set(visible.flatMap(e => firstTwoOutcomes(e).map(o => String(o.token))));
  Promise.allSettled([...tokens].slice(0,36).map(async token => {
    try {
      const res = await fetch(`${CLOB}/book?token_id=${encodeURIComponent(token)}`, {cache:'no-store'});
      if (!res.ok) return;
      const b = await res.json();
      if (b && (Array.isArray(b.bids) || Array.isArray(b.asks))) state.books.set(token,b);
    } catch {}
  })).then(() => renderCardsOnly());
  $('updated').textContent = 'Checked ' + new Date().toLocaleTimeString();
}, BOOK_REFRESH_MS);
})();
</script>
</body>
</html>
