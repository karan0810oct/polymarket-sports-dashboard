
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Sports Odds</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef4ff;font:14px Arial,sans-serif}
header{padding:18px;background:#172438}
h1{font-size:22px;margin:0 0 5px}
main{padding:12px;max-width:1000px;margin:auto}
.sports{display:flex;gap:9px;overflow-x:auto;margin:10px 0 16px}
.sport{flex:0 0 180px;text-align:left;padding:12px;border-radius:12px;border:1px solid #33465f;background:#19283e;color:white}
.sport.active{border:2px solid #65aaff}
.preview{font-size:12px;min-height:32px;color:#c3d1e5;margin-top:8px}
.blue,.green{padding:8px;text-align:center;border-radius:7px;margin-top:6px;font-weight:bold}
.blue{background:#dceaff;color:#155ab0}
.green{background:#ddf7e6;color:#13723b}
input,button{padding:10px;border-radius:8px;border:1px solid #33465f;background:#19283e;color:white}
input{width:100%;margin:6px 0}
.match{background:#19283e;border:1px solid #33465f;border-radius:12px;margin:10px 0;overflow:hidden}
.head{padding:13px;cursor:pointer}
.name{font-weight:bold;font-size:15px}
.meta{font-size:11px;color:#a5b5cc;margin-top:5px}
.rates{display:flex;gap:7px;padding:0 12px 12px}
.rate{flex:1;padding:9px 3px;text-align:center;border-radius:7px;background:#dceaff;color:#155ab0;font-weight:bold}
.rate.uk{background:#ddf7e6;color:#13723b}
.detail{padding:12px;border-top:1px solid #33465f;background:#111c2d}
.market{padding:9px 0;border-bottom:1px solid #33465f}
.outcome{display:inline-block;padding:7px;margin:3px;border-radius:6px;background:#203854;color:#b8d8ff}
.muted{color:#a5b5cc;font-size:12px}
</style>
</head>
<body>
<header>
<h1>Live Sports Odds</h1>
<div class="muted">Blue = Polymarket · Green = UK Bookmakers</div>
</header>
<main>
<input id="key" type="password" placeholder="The Odds API key (optional)">
<button id="save">Save key</button>
<button id="refresh">Refresh now</button>
<div class="sports" id="sports"></div>
<h3 id="heading">Cricket matches</h3>
<div class="muted" id="status">Loading public market data…</div>
<div id="list"></div>
<p class="muted">Prices depend on available API data. No fabricated odds. UK bookmaker prices require an API key. Refresh every 30 seconds.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const kinds=[
 {id:"cricket",name:"🏏 Cricket",terms:/cricket|ipl|t20|ashes|big bash|odi/i},
 {id:"soccer",name:"⚽ Soccer",terms:/soccer|football|premier league|champions league/i},
 {id:"tennis",name:"🎾 Tennis",terms:/tennis|atp|wta/i},
 {id:"mma",name:"🥊 MMA / UFC",terms:/mma|ufc|mixed martial|bellator|pfl/i}
];
let events=[],active="cricket",books=[],opened="",timer;
$("key").value=localStorage.getItem("sportsOddsKey")||"";
$("save").onclick=()=>{localStorage.setItem("sportsOddsKey",$("key").value.trim());$("status").textContent="API key saved.";load()};
$("refresh").onclick=load;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function arr(v){if(Array.isArray(v))return v;try{return JSON.parse(v||"[]")}catch{return []}}
function group(e){let s=(e.title||e.slug||"")+" "+(e.description||"");return kinds.find(k=>k.terms.test(s))?.id||""}
async function json(url){let r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
async function loadPoly(){
 let data=await json("https://gamma-api.polymarket.com/events?active=true&closed=false&limit=100&order=volume24hr&ascending=false");
 events=Array.isArray(data)?data:[];
}
function marketPrice(m){
 let outcomes=arr(m.outcomes),prices=arr(m.outcomePrices);
 return outcomes.map((o,i)=>({name:o,p:Number(prices[i])})).filter(x=>Number.isFinite(x.p)&&x.p>0&&x.p<1);
}
function dec(p){return p>0?(1/p).toFixed(2):"—"}
async function loadBooks(){
 books=[];
 let key=localStorage.getItem("sportsOddsKey");
 if(!key)return;
 try{
 let sports=await json("https://api.the-odds-api.com/v4/sports/?apiKey="+encodeURIComponent(key));
 let wanted=sports.filter(s=>s.active&&(/cricket|soccer|tennis|mma/i.test(s.title+" "+s.key)));
 for(let s of wanted.slice(0,10)){
  try{
   let d=await json("https://api.the-odds-api.com/v4/sports/"+encodeURIComponent(s.key)+"/odds/?regions=uk&markets=h2h&oddsFormat=decimal&apiKey="+encodeURIComponent(key));
   books.push(...d.map(e=>({...e,_sport:s.title})));
  }catch(e){console.warn(e)}
 }
 }catch(e){$("status").textContent="Bookmaker API: "+e.message+" · Polymarket data may still load."}
}
function bookFor(e){
 let a=(e.title||"").toLowerCase();
 return books.find(b=>[b.home_team,b.away_team].every(x=>x&&a.includes(x.toLowerCase())))||
 books.find(b=>a.includes((b.home_team||"").toLowerCase())&&(a.includes((b.away_team||"").toLowerCase())));
}
function bestBook(b){
 if(!b)return [];
 let out={};
 for(let bm of b.bookmakers||[])for(let m of bm.markets||[])if(m.key==="h2h")for(let o of m.outcomes||[]){
  if(!out[o.name]||o.price>out[o.name])out[o.name]=o.price;
 }
 return Object.entries(out);
}
function makeSports(){
 $("sports").innerHTML=kinds.map(k=>{
 let e=events.find(x=>group(x)===k.id);
 let ms=e?.markets?.find(m=>m.outcomes&&m.outcomePrices);
 let ps=ms?marketPrice(ms):[];
 return `<button class="sport ${active===k.id?"active":""}" data-id="${k.id}">
 <b>${k.name}</b><div class="preview">${esc(e?.title||"No matches available")}</div>
 <div class="muted">POLY · DECIMAL</div><div class="blue">${ps.slice(0,2).map(x=>dec(x.p)).join(" | ")||"—"}</div>
 <div class="muted">UK · DECIMAL</div><div class="green">—</div></button>`;
 }).join("");
 document.querySelectorAll(".sport").forEach(b=>b.onclick=()=>{active=b.dataset.id;opened="";render();});
}
function render(){
 makeSports();
 $("heading").textContent=kinds.find(k=>k.id===active).name+" matches";
 let q=$("search")?.value?.toLowerCase()||"";
 let list=events.filter(e=>group(e)===active&&(!q||(e.title||"").toLowerCase().includes(q)));
 $("list").innerHTML=list.length?list.map(e=>{
  let ms=(e.markets||[]).filter(m=>m.active!==false&&!m.closed);
  let primary=ms.find(m=>arr(m.outcomePrices).length>1)||ms[0];
  let ps=primary?marketPrice(primary):[];
  let b=bookFor(e),bp=bestBook(b);
  let id=e.id||e.slug;
  return `<article class="match">
  <div class="head" data-open="${esc(id)}"><div class="name">${esc(e.title||"Untitled match")}</div>
  <div class="meta">${e.endDate?new Date(e.endDate).toLocaleString():""} · Tap to view markets</div></div>
  <div class="rates"><div class="rate">${ps.map(x=>dec(x.p)).join(" | ")||"—"}<div class="muted">POLY</div></div>
  <div class="rate uk">${bp.map(x=>Number(x[1]).toFixed(2)).join(" | ")||"—"}<div class="muted">UK BOOKMAKERS</div></div></div>
  <div class="detail" id="detail-${esc(id)}" ${opened===id?"":"hidden"}>
  <h4>Available markets</h4>
  ${ms.length?ms.map(m=>`<div class="market"><b>${esc(m.question||m.groupItemTitle||"Market")}</b><div>${marketPrice(m).map(x=>`<span class="outcome">${esc(x.name)} · ${dec(x.p)}</span>`).join("")||'<span class="muted">Prices unavailable</span>'}</div></div>`).join(""):'<div class="muted">No open markets returned by API.</div>'}
  <p><a href="${e.slug?"https://polymarket.com/event/"+encodeURIComponent(e.slug):"https://polymarket.com/"}" target="_blank" rel="noopener">Open Polymarket market ↗</a></p>
  </div></article>`;
 }).join(""):'<div class="muted">No matching events returned by the public API for this sport.</div>';
 document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{let id=el.dataset.open;opened=opened===id?"":id;let d=$("detail-"+CSS.escape(id));if(d)d.hidden=opened!==id;});
}
async function load(){
 if(window.loading)return;
 window.loading=true;$("status").textContent="Updating odds…";
 try{
 await loadPoly();
 await loadBooks();
 makeSports();render();
 $("status").textContent="Updated "+new Date().toLocaleTimeString()+" · auto-refresh enabled";
 }catch(e){$("status").textContent="Could not load data: "+e.message+" · Check your connection and retry."}
 finally{window.loading=false}
}
$("search")?.addEventListener("input",render);
$("interval")?.addEventListener("change",()=>{clearInterval(timer);timer=setInterval(load,Number($("interval").value))});
load();timer=setInterval(load,30000);
})();
</script>
</body>
</html>
